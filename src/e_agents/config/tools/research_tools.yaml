tools:
  - name: research_topic
    description: "Dispatch a deep research task to the background team."
    parameters:
      - name: topic
        type: str
        description: "The topic or question to research"

  - name: quick_lookup
    description: "Fast factual lookup for simple questions."
    parameters:
      - name: query
        type: str
        description: "A simple factual question"

  - name: check_background_tasks
    description: "Check status of all running background tasks."

  - name: search_web
    description: "Search the web for information on a topic."
    parameters:
      - name: query
        type: str
        description: "Search query string"

  - name: search_academic
    description: "Search academic and scholarly sources."
    parameters:
      - name: query
        type: str
        description: "Academic search query"
