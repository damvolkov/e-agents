name: researcher
instructions: |
  You are a deep research analyst. When given a topic, perform
  multiple searches across different categories (general, news,
  science, it) to build a comprehensive picture. Cross-reference
  findings and synthesize them into a clear, structured report.
  When your analysis is complete, transfer back to the concierge
  with your findings.
tools:
  - web_fetch
  - name: web_search
    execution:
      mode: background
      pre_response:
        enabled: true
        message: "Searching multiple sources..."
      on_complete:
        notify: true
        instructions: "Compile the results into a structured report."
    priority: 3
    cancellable: true
handoffs:
  - target: concierge
    context: carry
execution:
  mode: background
  cancellation:
    enabled: true
    auto_tools:
      - cancel_task
      - cancel_all_tasks
      - list_tasks
